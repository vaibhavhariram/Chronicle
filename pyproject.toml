[project]
name = "chronicle-runtime"
version = "0.1.0"
description = "ML inference server for Chronicle"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
cuda = [
    "torch[cuda]>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chronicle_runtime"]

[tool.pytest.ini_options]
testpaths = ["chronicle_runtime/tests"]
pythonpath = ["."]
addopts = "-v"
asyncio_mode = "auto"
